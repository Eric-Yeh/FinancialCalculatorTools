<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版 OCR 圖文辨識工具 (全能版)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .control-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
        }
        select, input[type="file"], button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            background: white;
        }
        .hint-box {
            background-color: #e8f4fd;
            border-left: 4px solid #3498db;
            padding: 10px 15px;
            margin: 15px 0;
            border-radius: 0 5px 5px 0;
            font-size: 15px;
            color: #2980b9;
        }
        #progress {
            margin: 15px 0;
            font-weight: bold;
            color: #0066cc;
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 1.6;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 20px;
            display: none;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        #hiddenCanvas {
            display: none;
        }
        .label-text {
            font-weight: bold;
            color: #555;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>📄 網頁版 OCR 圖文辨識工具</h1>
        
        <div class="control-group">
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/jpg, image/bmp">
            
            <div>
                <span class="label-text">語言：</span>
                <select id="languageSelect">
                    <option value="chi_tra">繁體中文</option>
                    <option value="eng">英文</option>
                    <option value="chi_tra+eng" selected>繁體中文 + 英文</option>
                </select>
            </div>

            <div>
                <span class="label-text">模式：</span>
                <select id="modeSelect">
                    <option value="general" selected>📄 通用多行 (適合文章、截圖)</option>
                    <option value="tiny">🔍 極小單行 (適合檔名、程式碼)</option>
                </select>
            </div>
        </div>

        <div class="hint-box">
            💡 <strong>小提示：</strong> 支援 <strong>Ctrl + V</strong> (或 Cmd + V) 直接貼上截圖。若辨識亂碼，請嘗試切換「模式」。
        </div>

        <img id="imagePreview" alt="圖片預覽">
        <canvas id="hiddenCanvas"></canvas>
        <div id="progress">請選擇或貼上圖片開始辨識...</div>
        <textarea id="resultOutput" placeholder="辨識結果將會顯示在這裡..."></textarea>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const languageSelect = document.getElementById('languageSelect');
        const modeSelect = document.getElementById('modeSelect');
        const progressDiv = document.getElementById('progress');
        const resultOutput = document.getElementById('resultOutput');
        const imagePreview = document.getElementById('imagePreview');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        let currentFile = null;

        imageInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) { currentFile = e.target.files[0]; handleImage(currentFile); }
        });

        window.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    currentFile = items[i].getAsFile();
                    handleImage(currentFile);
                    e.preventDefault();
                    break;
                }
            }
        });

        // 語言或模式切換時自動重新辨識
        languageSelect.addEventListener('change', () => { if(currentFile) handleImage(currentFile); });
        modeSelect.addEventListener('change', () => { if(currentFile) handleImage(currentFile); });

        async function getImageUrl(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        async function handleImage(file) {
            if (!file) return;
            resultOutput.value = '';
            
            const imgUrl = await getImageUrl(file);
            const img = new Image();
            img.src = imgUrl;

            img.onload = async () => {
                const mode = modeSelect.value;
                const lang = languageSelect.value;
                
                // 根據模式決定放大倍率 (通用模式放大 2 倍即可，極小字放大 4 倍)
                const scale = (mode === 'tiny') ? 4 : 2;
                
                hiddenCanvas.width = img.width * scale;
                hiddenCanvas.height = img.height * scale;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

                // 只有在「極小單行」模式才啟用強烈的二值化
                if (mode === 'tiny') {
                    const imageData = ctx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        const value = gray < 160 ? 0 : 255;
                        data[i] = value; data[i + 1] = value; data[i + 2] = value;
                    }
                    ctx.putImageData(imageData, 0, 0);
                }

                const processedImageUrl = hiddenCanvas.toDataURL();
                imagePreview.src = imgUrl;
                imagePreview.style.display = 'block';

                try {
                    progressDiv.textContent = '系統準備中，正在載入模型...';
                    
                    // 設定 Tesseract 參數
                    const tesseractConfig = {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                progressDiv.textContent = `辨識中：${Math.round(m.progress * 100)}%`;
                            } else {
                                progressDiv.textContent = `狀態：${m.status}...`;
                            }
                        }
                    };

                    // 只有極小字模式才強制單行辨識
                    if (mode === 'tiny') {
                        tesseractConfig.tessedit_pageseg_mode = Tesseract.PSM.SINGLE_LINE;
                    }

                    const result = await Tesseract.recognize(processedImageUrl, lang, tesseractConfig);
                    progressDiv.textContent = '✅ 辨識完成！';
                    
                    let finalOutput = result.data.text;

                    // --- 針對中文的後處理：去除多餘空白 ---
                    if (lang.includes('chi_tra')) {
                        // 使用正則表達式，找出「中文字或全形標點」與「中文字或全形標點」之間的空白並移除
                        // 這樣可以保留英文單字之間的正常空白
                        const cjkRegex = /([\u4E00-\u9FFF\u3000-\u303F\uFF00-\uFFEF])\s+(?=[\u4E00-\u9FFF\u3000-\u303F\uFF00-\uFFEF])/g;
                        finalOutput = finalOutput.replace(cjkRegex, '$1');
                        // 執行第二次以防有重疊的空白未被匹配到
                        finalOutput = finalOutput.replace(cjkRegex, '$1');
                    }
                    
                    resultOutput.value = finalOutput.trim();
                    
                } catch (error) {
                    console.error(error);
                    progressDiv.textContent = '❌ 辨識發生錯誤，請確認圖片格式。';
                    resultOutput.value = error.message;
                }
            };
        }
    </script>
</body>
</html>
